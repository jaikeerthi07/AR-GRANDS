<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 270 340 690" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="gb-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae2d5" />
      <stop offset="55%" stop-color="#f1c5ad" />
      <stop offset="100%" stop-color="#dfa98e" />
    </linearGradient>
    <linearGradient id="gb-suit-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#29282f" />
      <stop offset="25%" stop-color="#1d1c22" />
      <stop offset="70%" stop-color="#121115" />
      <stop offset="100%" stop-color="#09080b" />
    </linearGradient>
    <linearGradient id="gb-lapel-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3d3c47" />
      <stop offset="60%" stop-color="#222129" />
      <stop offset="100%" stop-color="#121116" />
    </linearGradient>
  </defs>

  <g id="groom-body-group">
    <!-- Trousers -->
    <path id="groom-trousers"
          d="M 188,620 L 176,945 C 176,952 225,955 260,948 L 274,690 L 290,948 C 325,955 368,950 370,945 L 362,620 Z"
          fill="url(#gb-suit-grad)" />
    <path d="M 274,690 L 274,946" stroke="#0a0a0d" stroke-width="2.5" opacity="0.85" />
    <path d="M 198,620 C 190,725 184,835 180,940" stroke="#373642" stroke-width="1.2" opacity="0.5" />
    <path d="M 352,620 C 358,725 362,835 364,940" stroke="#2a2933" stroke-width="1.2" opacity="0.4" />

    <!-- Jacket Torso -->
    <path id="groom-jacket-back"
          d="M 136,312 C 160,292 230,278 288,278 C 342,278 376,288 396,306 L 382,622 C 325,635 220,635 168,622 Z"
          fill="url(#gb-suit-grad)" />
    <path d="M 274,295 L 274,625" stroke="#0e0d12" stroke-width="3" opacity="0.9" />
    <path d="M 205,310 C 215,405 215,515 208,624" stroke="#0e0d12" stroke-width="2" opacity="0.75" />
    <path d="M 342,310 C 334,405 334,515 342,624" stroke="#0e0d12" stroke-width="2" opacity="0.75" />

    <path id="groom-shirt-collar"
          d="M 248,268 C 265,263 300,263 316,268 L 318,280 C 300,275 264,275 246,280 Z" fill="#ffffff" />
    <path id="groom-suit-collar"
          d="M 236,278 C 262,268 304,268 328,278 L 332,304 C 304,295 260,295 232,304 Z"
          fill="url(#gb-lapel-grad)" stroke="#09080c" stroke-width="1.2" />

    <!-- Right Outer Arm -->
    <g id="groom-right-arm">
      <path d="M 136,312 C 118,348 112,410 110,470 C 108,525 118,575 130,605 L 164,600 C 154,570 146,515 148,460 C 150,405 160,340 172,320 Z"
            fill="url(#gb-suit-grad)" />
      <path d="M 130,605 L 164,600" stroke="#363542" stroke-width="2.5" />
      <circle cx="152" cy="594" r="2.2" fill="#4a4856" />
      <circle cx="152" cy="586" r="2.2" fill="#4a4856" />
      <circle cx="152" cy="578" r="2.2" fill="#4a4856" />
      <path d="M 132,605 L 162,600 L 160,610 L 134,614 Z" fill="#ffffff" opacity="0.9" />
      <path d="M 134,614 C 132,634 136,658 144,670 C 148,674 156,674 158,665 C 162,652 160,625 160,610 Z"
            fill="url(#gb-skin)" />
    </g>

    <!-- Left Inner Arm & Clasping Hand -->
    <g id="groom-left-arm">
      <path d="M 396,306 C 420,345 435,410 435,470 C 435,525 425,575 412,608 L 380,595 C 392,565 402,515 402,460 C 402,405 390,345 378,320 Z"
            fill="url(#gb-suit-grad)" />
      <path d="M 402,460 C 412,475 424,478 435,472" stroke="#33323e" stroke-width="1.8" fill="none" opacity="0.6" />
      <path d="M 380,595 L 412,608" stroke="#363542" stroke-width="2.5" />
      <circle cx="392" cy="590" r="2.2" fill="#4a4856" />
      <circle cx="398" cy="584" r="2.2" fill="#4a4856" />
      <path d="M 382,597 L 410,610 L 407,618 L 385,606 Z" fill="#ffffff" opacity="0.95" />
      <g id="groom-hand">
        <path d="M 385,606 C 382,624 386,644 395,662 C 402,672 414,674 422,666 C 426,658 424,642 418,624 C 414,614 407,618 407,618 Z"
              fill="url(#gb-skin)" />
        <path d="M 394,636 C 392,648 396,664 404,672 C 408,675 414,672 416,664 C 414,652 408,642 402,634 Z"
              fill="#e8b89c" stroke="#cca085" stroke-width="0.8" />
        <path d="M 402,642 C 402,654 407,670 414,676 C 418,677 423,673 423,664 C 420,652 415,642 410,638 Z"
              fill="#dfaa8c" stroke="#cca085" stroke-width="0.8" />
        <path d="M 410,646 C 412,656 416,670 422,674 C 426,675 429,670 428,662 C 425,652 421,644 416,642 Z"
              fill="#d8a183" stroke="#cca085" stroke-width="0.8" />
      </g>
    </g>
  </g>
</svg>
