<svg xmlns="http://www.w3.org/2000/svg" viewBox="380 270 380 690" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="bb-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4ed" />
      <stop offset="45%" stop-color="#fce7dc" />
      <stop offset="85%" stop-color="#f4cdb9" />
      <stop offset="100%" stop-color="#e8b69f" />
    </linearGradient>
    <linearGradient id="bb-dress-silk" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fdfcf9" />
      <stop offset="60%" stop-color="#f6f1e8" />
      <stop offset="100%" stop-color="#e9dfd0" />
    </linearGradient>
    <linearGradient id="bb-sash-silk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8f4ec" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#ede3d1" />
      <stop offset="100%" stop-color="#ded0bd" />
    </linearGradient>
  </defs>

  <g id="bride-body-group">
    <!-- Skirt -->
    <path id="bride-skirt-base"
          d="M 522,575 C 504,660 472,785 440,950 C 516,966 690,966 755,950 C 728,785 670,660 638,575 Z"
          fill="url(#bb-dress-silk)" />
    <path d="M 522,575 C 510,685 480,815 455,952" stroke="#d5c8b5" stroke-width="5" fill="none" opacity="0.8" />
    <path d="M 545,576 C 535,695 518,825 505,954" stroke="#dbcfbd" stroke-width="4.5" fill="none" opacity="0.75" />
    <path d="M 572,577 C 568,705 564,835 562,956" stroke="#ded3c3" stroke-width="3.5" fill="none" opacity="0.7" />
    <path d="M 602,577 C 606,705 618,835 628,956" stroke="#ded3c3" stroke-width="4" fill="none" opacity="0.75" />
    <path d="M 626,576 C 638,695 672,825 696,954" stroke="#d7cab8" stroke-width="5" fill="none" opacity="0.8" />
    <path d="M 638,575 C 662,685 718,815 745,952" stroke="#cdbea9" stroke-width="6" fill="none" opacity="0.85" />
    <path d="M 556,580 C 550,705 540,835 536,953" stroke="#ffffff" stroke-width="4.5" fill="none" opacity="0.95" />
    <path d="M 586,580 C 588,705 592,835 596,955" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.95" />
    <path d="M 614,580 C 622,705 644,835 660,953" stroke="#ffffff" stroke-width="4.5" fill="none" opacity="0.95" />

    <!-- Waistband -->
    <path d="M 522,540 C 560,548 600,548 638,540 L 638,576 C 600,584 560,584 522,576 Z"
          fill="url(#bb-sash-silk)" stroke="#d4c6b2" stroke-width="1.2" />
    <path d="M 525,550 C 560,557 600,557 635,550" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.95" />
    <path d="M 525,566 C 560,573 600,573 635,566" stroke="#ded1be" stroke-width="1.6" fill="none" opacity="0.85" />

    <!-- Bare Back & Bodice -->
    <path id="bride-back-skin"
          d="M 565,275 C 535,305 500,330 490,355 L 515,542 C 555,548 602,548 642,542 L 672,345 C 658,322 622,298 595,275 Z"
          fill="url(#bb-skin)" />
    <path d="M 580,285 L 580,480" stroke="#e4ad96" stroke-width="1.8" opacity="0.45" />
    <path d="M 548,345 C 538,370 540,396 550,410" stroke="#e1a48c" stroke-width="2.2" fill="none" opacity="0.4" />
    <path d="M 612,345 C 622,370 620,396 610,410" stroke="#e1a48c" stroke-width="2.2" fill="none" opacity="0.4" />

    <path id="bride-gown-bodice"
          d="M 504,445 C 532,455 565,472 580,510 C 595,472 628,455 656,445 L 640,544 C 602,550 558,550 520,544 Z"
          fill="url(#bb-dress-silk)" stroke="#d8cbba" stroke-width="1.2" />
    <path d="M 580,510 L 580,545" stroke="#ccbda8" stroke-width="2" opacity="0.8" />
    <path d="M 542,460 C 544,488 540,516 534,544" stroke="#ded0be" stroke-width="1.6" opacity="0.65" />
    <path d="M 618,460 C 616,488 620,516 626,544" stroke="#ded0be" stroke-width="1.6" opacity="0.65" />
    <path d="M 504,445 C 532,455 565,472 580,510 C 595,472 628,455 656,445"
          stroke="#ffffff" stroke-width="2.8" fill="none" opacity="0.95" />

    <!-- Left Outer Arm -->
    <g id="bride-left-arm">
      <path d="M 672,345 C 686,375 700,430 696,485 C 692,538 680,585 670,616 C 666,632 670,642 674,648 C 678,652 683,648 686,638 C 696,598 710,544 712,482 C 715,425 700,362 678,332 Z"
            fill="url(#bb-skin)" />
      <path d="M 696,485 C 698,502 696,522 692,544" stroke="#e5b09d" stroke-width="1.5" fill="none" opacity="0.4" />
    </g>

    <!-- Right Inner Arm & Clasping Hand -->
    <g id="bride-right-arm">
      <path d="M 490,345 C 472,376 458,432 450,485 C 442,535 430,578 418,604 L 398,596 C 410,570 424,522 432,470 C 440,418 454,360 476,332 Z"
            fill="url(#bb-skin)" />
      <path d="M 432,470 C 430,490 424,522 418,560" stroke="#dfa38c" stroke-width="1.8" fill="none" opacity="0.45" />

      <g id="bride-hand">
        <path d="M 418,600 C 422,612 424,625 420,638 C 417,646 410,652 402,650 C 397,644 397,628 402,608 Z"
              fill="url(#bb-skin)" />
        <path d="M 410,626 C 412,638 412,654 407,664 C 405,667 401,666 400,660 C 400,648 404,636 406,626 Z"
              fill="#fbe4d7" stroke="#e6b5a2" stroke-width="0.7" />
        <path d="M 416,630 C 420,644 418,658 413,668 C 411,670 407,669 407,661 C 408,650 411,638 412,630 Z"
              fill="#fdece3" stroke="#e6b5a2" stroke-width="0.7" />
      </g>
    </g>
  </g>
</svg>
