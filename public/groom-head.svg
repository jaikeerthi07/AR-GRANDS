<svg xmlns="http://www.w3.org/2000/svg" viewBox="210 60 170 220" width="100%" height="100%" style="background: transparent;">
  <defs>
    <linearGradient id="gh-skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae2d5" />
      <stop offset="55%" stop-color="#f1c5ad" />
      <stop offset="100%" stop-color="#dfa98e" />
    </linearGradient>
    <linearGradient id="gh-hair-base" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#2d292e" />
      <stop offset="35%" stop-color="#1e1a1f" />
      <stop offset="80%" stop-color="#110d11" />
      <stop offset="100%" stop-color="#080608" />
    </linearGradient>
    <linearGradient id="gh-hair-highlight" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#544c57" />
      <stop offset="50%" stop-color="#38303b" />
      <stop offset="100%" stop-color="#1d191f" />
    </linearGradient>
  </defs>

  <g id="groom-head-group">
    <!-- Sculpted Strong Neck -->
    <path id="groom-neck"
          d="M 256,215 C 254,242 252,260 250,268 C 270,272 292,272 312,268 C 310,260 308,242 306,215 Z"
          fill="url(#gh-skin)" />
    <path d="M 272,220 C 274,244 276,260 280,268" stroke="#d99f80" stroke-width="1.5" opacity="0.4" />

    <!-- Groom Right Ear & Jawline -->
    <g id="groom-ear">
      <path d="M 310,178 C 324,174 332,185 330,202 C 328,214 318,220 310,216 Z"
            fill="url(#gh-skin)" stroke="#d29676" stroke-width="0.8" />
      <path d="M 314,184 C 322,182 326,190 324,200 C 322,206 318,208 314,206"
            stroke="#c58462" stroke-width="1.2" fill="none" opacity="0.8" />
    </g>
    <path d="M 312,202 C 320,212 320,224 314,236 C 310,244 306,252 304,258"
          stroke="#cc9273" stroke-width="1.5" fill="none" opacity="0.5" />

    <!-- Textured Natural Hair with Layered Locks -->
    <g id="groom-hair-layers">
      <path d="M 234,216 C 220,200 212,165 218,132 C 228,95 258,70 295,70 C 334,70 362,98 364,136 C 365,166 354,198 334,220 C 322,210 316,195 312,182 C 306,178 290,222 272,226 C 258,228 242,224 234,216 Z"
            fill="url(#gh-hair-base)" />
      <path d="M 248,88 C 272,74 310,76 335,92 C 308,85 272,87 248,88 Z"
            fill="url(#gh-hair-highlight)" opacity="0.7" />
      <path d="M 260,102 C 288,88 326,96 346,115 C 324,106 285,106 260,102 Z"
            fill="url(#gh-hair-highlight)" opacity="0.6" />
      <path d="M 232,126 C 256,108 296,112 330,128 C 292,118 254,126 232,126 Z"
            fill="url(#gh-hair-highlight)" opacity="0.5" />
      <path d="M 226,158 C 250,136 302,140 336,160 C 296,148 250,158 226,158 Z"
            fill="url(#gh-hair-highlight)" opacity="0.45" />
      <path d="M 250,210 C 256,220 264,228 270,230 C 276,228 284,220 290,210"
            stroke="#100f13" stroke-width="2.5" fill="none" />
      <path d="M 260,204 C 266,214 272,220 278,220"
            stroke="#33313d" stroke-width="1.8" fill="none" opacity="0.7" />
    </g>
  </g>
</svg>
